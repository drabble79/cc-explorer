<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 세션 뷰어</title>
<style>
  /* ==================== 디자인 토큰 ====================
     보라 단일 액센트. 그라데이션·글로우는 쓰지 않고 면은 전부 단색으로 채운다.
     보조색(info/accent-2)은 도구·thinking 블록 구분에만 낮은 채도로 쓴다.
     라이트/다크 두 벌을 :root[data-theme] 로 전환한다. */
  :root {
    /* --- 공통 --- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
    --r1:4px; --r2:6px; --r3:10px; --r4:14px; --pill:999px;
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:15px;
    --bar-h:50px;
    --font:Pretendard,"Pretendard Variable",Inter,system-ui,-apple-system,"Segoe UI",
           Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","SF Mono",Menlo,"D2Coding",Consolas,monospace;

    /* --- 다크 (기본) --- */
    --bg:#14121a;
    --surface:#1b1924;
    --surface-2:#232030;
    --surface-3:#2d2a3c;
    --code-bg:#100e16;
    --line:#2e2b3a;
    --line-2:#3d3950;
    --fg:#e8e6f0;
    --fg-2:#b8b3c9;
    --muted:#867f9b;

    --accent:#9d7cf4;
    --on-accent:#16121f;
    --tint:rgba(157,124,244,.12);
    --tint-2:rgba(157,124,244,.22);

    --info:#7d9cc4;             /* 도구 호출 */
    --info-tint:rgba(125,156,196,.12);
    --accent-2:#c47fa8;         /* thinking */
    --tint-p:rgba(196,127,168,.12);

    --ok:#6fbf8e;
    --warn:#d4a45e;
    --warn-tint:rgba(212,164,94,.14);
    --danger:#e08a86;
    --danger-tint:rgba(224,138,134,.14);

    --sh-1:0 1px 2px rgba(0,0,0,.28);
    --sh-2:0 6px 20px rgba(0,0,0,.4);
    --sh-3:0 18px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  /* --- 라이트 --- */
  :root[data-theme="light"] {
    --bg:#faf9fc;
    --surface:#ffffff;
    --surface-2:#f3f1f8;
    --surface-3:#e9e6f2;
    --code-bg:#f5f3fa;
    --line:#e4e1ed;
    --line-2:#d2cde0;
    --fg:#211f2b;
    --fg-2:#4a4559;
    --muted:#6e6883;

    /* 흰 배경에서 본문 대비 4.5:1 을 넘기도록 잡은 값들 */
    --accent:#6d4bc4;
    --on-accent:#ffffff;
    --tint:rgba(109,75,196,.09);
    --tint-2:rgba(109,75,196,.17);

    --info:#4f7296;
    --info-tint:rgba(79,114,150,.10);
    --accent-2:#9c5878;
    --tint-p:rgba(156,88,120,.10);

    --ok:#2f8f63;
    --warn:#8a6115;
    --warn-tint:rgba(138,97,21,.12);
    --danger:#c0453f;
    --danger-tint:rgba(192,69,63,.10);

    --sh-1:0 1px 2px rgba(40,30,70,.07);
    --sh-2:0 6px 18px rgba(40,30,70,.10);
    --sh-3:0 18px 44px rgba(40,30,70,.16);
    color-scheme:light;
  }

  /* ==================== 기본 ==================== */
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font:var(--fs-base)/1.6 var(--font); background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
         text-rendering:optimizeLegibility; overflow:hidden; }
  button { font:inherit; }
  input, select { font:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input:focus, select:focus { outline:none; }
  input:focus-visible, select:focus-visible { outline:none;
    border-color:var(--accent); box-shadow:0 0 0 3px var(--tint); }
  * { scrollbar-width:thin; scrollbar-color:var(--line-2) transparent; }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:8px;
                              border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); background-clip:content-box; }

  /* ==================== 헤더 ==================== */
  header { height:var(--bar-h); padding:0 var(--s4); display:flex; align-items:center;
           gap:var(--s3); flex:0 0 auto; position:relative; z-index:20;
           background:var(--surface); border-bottom:1px solid var(--line); }
  header h1 { font-size:var(--fs-md); margin:0; font-weight:700; letter-spacing:-.01em;
              display:flex; align-items:center; gap:var(--s2); white-space:nowrap; }
  header h1 span.mark { width:9px; height:9px; flex:0 0 9px; border-radius:3px;
              background:var(--accent); }
  header h1 b { color:var(--fg); font-weight:700; }
  header .root { color:var(--muted); font-size:var(--fs-xs); font-family:var(--mono);
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40ch; }
  header .grow { flex:1; }
  #globalSearch { background:var(--bg); border:1px solid var(--line); color:var(--fg);
                  border-radius:var(--r2); padding:6px 11px; width:260px; font-size:var(--fs-md);
                  transition:border-color .14s, box-shadow .14s; }
  #globalSearch::placeholder { color:var(--muted); }
  #globalSearch:hover { border-color:var(--line-2); }

  /* ==================== 버튼 공통 ==================== */
  #settingsBtn, #dateBtn, #themeBtn, #filterBtn, .minibtn, .sess .extendbtn {
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-2);
    border-radius:var(--r2); cursor:pointer; white-space:nowrap;
    transition:background .14s, border-color .14s, color .14s;
  }
  #settingsBtn:hover, #dateBtn:hover, #themeBtn:hover, #filterBtn:hover,
  .minibtn:hover, .sess .extendbtn:hover {
    background:var(--surface-3); border-color:var(--line-2); color:var(--fg);
  }
  #settingsBtn, #dateBtn { padding:6px 12px; font-size:var(--fs-sm); }
  #dateBtn.active { color:var(--accent); background:var(--tint); border-color:var(--tint-2); }
  #themeBtn { padding:6px 10px; font-size:var(--fs-base); line-height:1; }

  /* 팝오버 공통 */
  .dfwrap { position:relative; }
  #datePop, #filterPop { position:absolute; top:calc(100% + 6px); right:0;
             background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r3);
             padding:var(--s2); z-index:30; display:none; min-width:196px; box-shadow:var(--sh-2); }
  #datePop.open, #filterPop.open { display:block; }
  #datePop .fp-h, #filterPop .fp-h { color:var(--muted); font-size:var(--fs-xs); font-weight:600;
             padding:0 var(--s1) var(--s2); margin-bottom:var(--s1);
             border-bottom:1px solid var(--line); }
  .fchk { display:flex; align-items:center; gap:var(--s2); padding:6px var(--s2);
          font-size:var(--fs-md); cursor:pointer; border-radius:var(--r1); color:var(--fg-2);
          transition:background .12s, color .12s; }
  .fchk:hover { background:var(--surface-2); color:var(--fg); }
  .fchk input { width:14px; height:14px; cursor:pointer; accent-color:var(--accent); }
  #dpCustom { display:none; margin-top:var(--s2); padding-top:var(--s2);
              border-top:1px solid var(--line); font-size:var(--fs-sm); color:var(--muted); }
  #dpCustom.show { display:block; }
  #dpCustom input[type=date] { background:var(--bg); border:1px solid var(--line); color:var(--fg);
              border-radius:var(--r1); padding:4px 7px; font-size:var(--fs-sm); }

  /* ==================== 설정 드로어 ==================== */
  #drawerOverlay { position:fixed; inset:0; background:rgba(12,10,20,.42); z-index:40;
                   opacity:0; pointer-events:none; transition:opacity .16s; }
  #drawerOverlay.show { opacity:1; pointer-events:auto; }
  #settingsDrawer { position:fixed; top:0; right:0; height:100%; width:400px; max-width:90vw;
                    background:var(--surface); z-index:41; border-left:1px solid var(--line-2);
                    transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
                    display:flex; flex-direction:column; box-shadow:var(--sh-3); }
  #settingsDrawer.open { transform:translateX(0); }
  #settingsDrawer .dhead { padding:var(--s5); border-bottom:1px solid var(--line); position:relative; }
  #settingsDrawer .dhead b { font-size:var(--fs-lg); font-weight:700; color:var(--fg);
                             letter-spacing:-.01em; }
  #settingsDrawer .dpath { color:var(--muted); font-size:var(--fs-xs); margin-top:var(--s1);
                           font-family:var(--mono); word-break:break-all; }
  #drawerClose { position:absolute; top:var(--s4); right:var(--s4); cursor:pointer;
                 color:var(--muted); font-size:var(--fs-base); width:26px; height:26px;
                 display:flex; align-items:center; justify-content:center;
                 border-radius:var(--r2); transition:background .14s, color .14s; }
  #drawerClose:hover { color:var(--fg); background:var(--surface-2); }
  #settingsBody { overflow:auto; padding:var(--s5) var(--s5) var(--s6); }
  .snote { color:var(--muted); font-size:var(--fs-sm); line-height:1.6; margin-bottom:var(--s4);
           background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r2);
           padding:var(--s3); }
  .sgrp { margin-bottom:var(--s5); }
  .sgrp-h { color:var(--muted); font-size:var(--fs-xs); font-weight:600; letter-spacing:.04em;
            text-transform:uppercase; margin:var(--s5) 0 var(--s2); padding-bottom:var(--s2);
            border-bottom:1px solid var(--line); }
  .schk { display:flex; align-items:center; gap:var(--s3); padding:8px var(--s3); cursor:pointer;
          border-radius:var(--r2); transition:background .14s; }
  .schk:hover { background:var(--surface-2); }
  .schk input { width:15px; height:15px; cursor:pointer; accent-color:var(--accent); flex:0 0 15px; }
  .schk .sname { font-size:var(--fs-md); word-break:break-all; color:var(--fg-2); }
  .schk .sabsent { font-size:var(--fs-xs); font-weight:600; color:var(--accent);
                   background:var(--tint); border-radius:var(--r1); padding:1px 7px;
                   margin-left:auto; flex:0 0 auto; }
  .sro { display:flex; justify-content:space-between; gap:var(--s3); padding:var(--s1);
         color:var(--muted); font-size:var(--fs-sm); }
  .sro .sval { color:var(--fg-2); }
  .seffort select { background:var(--bg); border:1px solid var(--line); color:var(--fg);
                    border-radius:var(--r2); padding:8px 11px; font-size:var(--fs-md); width:100%;
                    cursor:pointer; transition:border-color .14s; }
  .seffort select:hover { border-color:var(--line-2); }
  .sstatus { font-size:var(--fs-sm); min-height:20px; margin-top:var(--s3); }
  .sstatus.ok { color:var(--ok); } .sstatus.err { color:var(--danger); }
  .snum { display:flex; align-items:center; gap:var(--s2); padding:8px var(--s3);
          border-radius:var(--r2); transition:background .14s; }
  .snum:hover { background:var(--surface-2); }
  .snum label { font-size:var(--fs-md); color:var(--fg-2); }
  .snum input { width:92px; background:var(--bg); border:1px solid var(--line); color:var(--fg);
                border-radius:var(--r2); padding:5px 9px; font-size:var(--fs-md);
                font-variant-numeric:tabular-nums; }
  .snum .unit { color:var(--muted); font-size:var(--fs-sm); }
  .snum-view b { font-size:var(--fs-lg); font-weight:700; color:var(--accent);
                 font-variant-numeric:tabular-nums; }
  .snum-input, .snum-eunit, .snum-save, .snum-cancel { display:none; }
  .snum-edit { margin-left:auto; }
  .snum.editing .snum-view, .snum.editing .snum-edit { display:none; }
  .snum.editing .snum-input, .snum.editing .snum-eunit { display:inline-block; }
  .snum.editing .snum-save { display:inline-block; margin-left:auto; }
  .snum.editing .snum-cancel { display:inline-block; }

  /* ==================== 레이아웃 ==================== */
  .main { flex:1; display:flex; min-height:0; }
  .pane { overflow:auto; height:100%; overscroll-behavior:contain; }
  #tree { flex:0 0 284px; padding:var(--s2); background:var(--surface); }
  #list { flex:0 0 340px; padding-bottom:var(--s6); }
  #detail { flex:1 1 0; min-width:0; padding:0; }
  .splitter { flex:0 0 1px; position:relative; background:var(--line);
              cursor:col-resize; transition:background .14s; }
  .splitter::after { content:""; position:absolute; inset:0 -5px; z-index:10; }
  .splitter:hover, .splitter.drag { background:var(--accent); }
  body.resizing { cursor:col-resize; user-select:none; }

  /* ==================== 좌측 디렉토리 트리 ==================== */
  .node { user-select:none; }
  .node .row { display:flex; align-items:center; gap:var(--s2); position:relative;
               height:30px; padding:0 var(--s3) 0 var(--s2); margin:1px 0; cursor:pointer;
               white-space:nowrap; border-radius:var(--r2); font-size:var(--fs-md);
               color:var(--fg-2); transition:background .12s, color .12s; }
  .node .row:hover { background:var(--surface-2); color:var(--fg); }
  .node .row.sel { background:var(--tint); color:var(--fg); font-weight:600; }
  .node .row.sel::before { content:""; position:absolute; left:0; top:6px; bottom:6px;
                           width:2px; border-radius:2px; background:var(--accent); }
  .tw { width:14px; height:14px; flex:0 0 14px; display:inline-flex;
        align-items:center; justify-content:center; color:var(--muted); }
  .tw.has::before { content:""; width:0; height:0; border-left:4px solid currentColor;
                    border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
                    transition:transform .16s cubic-bezier(.4,0,.2,1); }
  .node.open > .row .tw.has::before { transform:rotate(90deg); }
  .row:hover .tw { color:var(--fg-2); }
  .row.sel .tw { color:var(--accent); }
  .ndot { width:6px; height:6px; flex:0 0 6px; border-radius:2px;
          background:var(--muted); opacity:.5; }
  .row.sel .ndot { background:var(--accent); opacity:1; }
  .nlabel { display:flex; align-items:baseline; min-width:0; overflow:hidden; }
  .npre { color:var(--muted); font-size:var(--fs-sm); flex:0 1 auto; min-width:0;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nlast { flex:0 0 auto; white-space:nowrap; }
  .ncount { margin-left:auto; padding:0 7px; color:var(--muted); font-size:var(--fs-xs);
            font-variant-numeric:tabular-nums; background:var(--surface-2);
            border-radius:var(--pill); }
  .row.sel .ncount { color:var(--accent); background:var(--tint-2); }
  .children { display:none; margin-left:14px; border-left:1px solid var(--line); }
  .node.open > .children { display:block; }
  /* 즐겨찾기 · 휴지통 — 트리 맨 위 고정 항목 (구분선은 마지막 것에만) */
  .trashnode { margin-bottom:var(--s2); padding-bottom:var(--s2);
               border-bottom:1px solid var(--line); }
  .favrow .favstar { flex:0 0 14px; width:14px; text-align:center; color:var(--warn);
                     font-size:var(--fs-sm); line-height:1; }
  .favrow .trashicon { color:var(--muted); font-size:var(--fs-xs); }

  /* ==================== 세션 목록 ==================== */
  .bhead { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:var(--s2);
           padding:var(--s2) var(--s3); background:var(--surface);
           border-bottom:1px solid var(--line); cursor:pointer; font-size:var(--fs-sm);
           white-space:nowrap; transition:background .14s; }
  .bhead:hover { background:var(--surface-2); }
  .bhead .tw { color:var(--muted); }
  .bgroup.open > .bhead .tw.has::before { transform:rotate(90deg); }
  .bhead .bname { color:var(--fg-2); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .bhead .bcount { margin-left:auto; color:var(--muted); background:var(--surface-3);
                   border-radius:var(--pill); padding:0 8px; font-size:var(--fs-xs);
                   font-variant-numeric:tabular-nums; }
  .bgroup:not(.open) .bbody { display:none; }
  .sess { position:relative; margin:var(--s2) var(--s3); padding:var(--s3) var(--s3) var(--s3) var(--s4);
          border:1px solid var(--line); border-radius:var(--r3); cursor:pointer;
          background:var(--surface); transition:background .12s, border-color .12s; }
  .sess:hover { background:var(--surface-2); border-color:var(--line-2); }
  .sess.sel { background:var(--tint); border-color:var(--tint-2); }
  .sess.sel::before { content:""; position:absolute; left:0; top:var(--s3); bottom:var(--s3);
                      width:2px; border-radius:0 2px 2px 0; background:var(--accent); }
  .sess.forked::after { content:""; position:absolute; left:0; top:var(--s3); bottom:var(--s3);
                        width:2px; border-radius:0 2px 2px 0; background:var(--info); }
  .forktag { color:var(--info); background:var(--info-tint); border-radius:var(--r1);
             padding:1px 6px; font-size:var(--fs-xs); font-weight:600; }
  .sess .t { font-weight:600; font-size:var(--fs-md); color:var(--fg); margin-bottom:3px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.5;
             padding-right:48px; }   /* 우상단 액션 버튼 자리 */
  /* 카드 우상단 액션 — 즐겨찾기 · 휴지통. 평소엔 흐리고 올리면 색이 산다 */
  .sess .cardacts { position:absolute; top:5px; right:5px; display:flex; gap:1px; }
  .sess .cardacts button { background:none; border:none; color:var(--line-2); cursor:pointer;
                  line-height:1; padding:3px 5px; border-radius:var(--r1);
                  transition:color .14s, background .14s; }
  .sess .favbtn { font-size:var(--fs-base); }
  .sess .favbtn:hover { color:var(--warn); background:var(--surface-3); }
  .sess .favbtn.on { color:var(--warn); }
  .sess .trashbtn { font-size:var(--fs-sm); }
  .sess .trashbtn:hover { color:var(--danger); background:var(--surface-3); }
  /* 휴지통 카드 — 살아있는 세션과 구분되게 흐리고, 액션 줄을 따로 둔다 */
  .sess.trashcard { opacity:.85; }
  .sess.trashcard:hover { opacity:1; }
  .sess.trashcard .t { padding-right:0; }
  .sess.trashcard .tpath { font-family:var(--mono); font-size:var(--fs-xs); margin-top:2px; }
  .sess.trashcard .retention { gap:var(--s1); flex-wrap:wrap; }
  .sess.trashcard .minibtn { margin-left:0; }
  .sess .sub { color:var(--muted); font-size:var(--fs-sm); overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  .sess .meta { color:var(--muted); font-size:var(--fs-xs); margin-top:var(--s2);
                display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center; }
  .badge { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r1);
           padding:1px 7px; font-size:var(--fs-xs); color:var(--muted);
           font-variant-numeric:tabular-nums; }
  .hits { color:var(--accent); font-weight:600; }
  .sess .selchk { width:14px; height:14px; margin-right:var(--s2); vertical-align:-2px;
                  cursor:pointer; accent-color:var(--accent); }
  .sess .retention { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s2);
                     font-size:var(--fs-xs); }
  .sess .extendbtn { padding:1px 8px; font-size:var(--fs-xs); color:var(--muted); }
  .sess .extendbtn:hover { color:var(--accent); border-color:var(--tint-2); }
  .badge.del { background:transparent; border-color:var(--line-2); color:var(--muted); }
  .badge.del.warn { color:var(--warn); border-color:transparent; background:var(--warn-tint); }
  .badge.del.crit { color:var(--danger); border-color:transparent; background:var(--danger-tint);
                    font-weight:600; }
  .ltoolbar { display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
              border-bottom:1px solid var(--line); position:sticky; top:0; z-index:6;
              background:var(--bg); }
  .ltoolbar.sel { background:var(--surface-2); border-bottom-color:var(--line-2); }
  .ltoolbar .selall { display:flex; align-items:center; gap:var(--s1); cursor:pointer;
                      font-size:var(--fs-sm); color:var(--fg-2); flex:0 0 auto; white-space:nowrap; }
  .ltoolbar .selall input { width:14px; height:14px; cursor:pointer; accent-color:var(--accent); }
  .ltoolbar .selcount { color:var(--muted); font-size:var(--fs-sm); min-width:0;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ltoolbar .minibtn { margin-left:0; flex:0 0 auto; }

<script>

    document.documentElement.dataset.theme = (t==="light"||t==="dark") ? t
      : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

<script>
const $ = s => document.querySelector(s);
let SESSIONS = [];          // 전체 메타
let curList = [];           // 현재 목록(필터·정렬 적용본)
let curListRaw = [];        // 목록 원본(트리 선택 또는 검색 결과) — 필터 재적용용
let curListTitle = "";
let cleanupDays = 30;       // settings.cleanupPeriodDays (없으면 30) — 삭제 카운트다운 기준
let selectMode = false;     // 목록 선택 모드
const selected = new Set(); // 선택된 세션 file 경로
let curListIsFav = false;   // 현재 목록이 즐겨찾기 뷰인지 (토글 시 즉시 반영해야 함)
let curListIsTrash = false; // 현재 목록이 휴지통 뷰인지
let TRASH = [];             // 휴지통 항목 (서버 /api/trash)

// ---------- 즐겨찾기 ----------
// 파일 경로가 아니라 세션 uuid 로 저장한다 — 경로는 프로젝트 폴더가 바뀌면 달라진다.
function loadFavs(){
  try{ const a=JSON.parse(localStorage.getItem("ccsv-favs")||"[]");
       return new Set(Array.isArray(a)?a:[]); }catch(e){ return new Set(); }
}
const favorites = loadFavs();
function saveFavs(){ try{ localStorage.setItem("ccsv-favs", JSON.stringify([...favorites])); }catch(e){} }
function isFav(s){ return !!s && favorites.has(s.uuid); }
function favSessions(){ return SESSIONS.filter(s=>favorites.has(s.uuid)); }
// 트리의 즐겨찾기 개수만 갱신 (트리 전체를 다시 그리면 펼침/스크롤이 튄다)
function updateFavCount(){
  const el=document.querySelector("#tree .favrow .ncount");
  if(el) el.textContent = favSessions().length;
}
// 타임라인 헤더의 즐겨찾기 버튼 표시 동기화
function syncSumFav(s){
  const fb=$("#favBtn");
  if(!fb || !curFile || curFile!==s.file) return;
  const on=isFav(s);
  fb.classList.toggle("on", on);
  fb.textContent = (on?"★":"☆")+" 즐겨찾기";
}
// btn 을 넘기면 목록 전체를 다시 그리지 않고 그 버튼만 바꾼다(스크롤 위치 보존).
// 즐겨찾기 뷰에서는 항목이 빠져야 하므로 목록을 다시 그린다.
function toggleFav(s, btn){
  const on = !favorites.has(s.uuid);
  if(on) favorites.add(s.uuid); else favorites.delete(s.uuid);
  saveFavs();
  updateFavCount();
  if(curListIsFav) rerenderList();
  else if(btn){ btn.classList.toggle("on", on); btn.textContent = on?"★":"☆";
                btn.title = on?"즐겨찾기 해제":"즐겨찾기"; }
  syncSumFav(s);
}

// ---------- 삭제 카운트다운 ----------
const DAY_MS = 86400000;
// mtime(초) 기준 삭제까지 남은 일수. 없으면 null.
function daysLeft(s){
  if(!s || !s.mtime) return null;
  const deleteAt = s.mtime*1000 + cleanupDays*DAY_MS;
  return Math.ceil((deleteAt - Date.now())/DAY_MS);
}
function delBadge(s){
  const n=daysLeft(s);
  if(n===null) return "";
  const cls = n<=3 ? "del crit" : n<=7 ? "del warn" : "del";
  const label = n<=0 ? "삭제 임박" : "삭제 D-"+n;
  return `<span class="badge ${cls}" title="마지막 활동(mtime) 후 ${cleanupDays}일에 Claude Code 가 자동 삭제">${label}</span>`;
}
async function loadCleanupDays(){
  try{
    const d=await (await fetch("/api/settings")).json();
    const it=(d.items||[]).find(x=>x.label==="cleanupPeriodDays");
    if(it && typeof it.value==="number") cleanupDays=it.value;
  }catch(e){/* 기본 30 유지 */}
}

// ---------- 날짜(기간) 필터 — 마지막 활동(lastTs) 기준, 목록에만 적용, localStorage 저장 ----------
function loadDateFilter(){
  try{ const r=JSON.parse(localStorage.getItem("ccsv-daterange")||"null");
    if(r && r.mode) return {mode:r.mode, from:r.from||null, to:r.to||null}; }catch(e){}
  return {mode:"all", from:null, to:null};
}
let dateFilter = loadDateFilter();
function saveDateFilter(){ localStorage.setItem("ccsv-daterange", JSON.stringify(dateFilter)); }
// 현재 필터를 [from, to] Date 범위로 환산(상대 프리셋은 호출 시점 기준). 없으면 null.
function getDateRange(){
  const f=dateFilter;
  if(f.mode==="all") return {from:null, to:null};
  if(f.mode==="custom") return {
    from: f.from ? new Date(f.from+"T00:00:00") : null,
    to:   f.to   ? new Date(f.to+"T23:59:59.999") : null };
  const now=new Date();
  if(f.mode==="today"){ const d=new Date(now); d.setHours(0,0,0,0); return {from:d, to:null}; }
  const days = f.mode==="30" ? 30 : 7;
  return {from: new Date(now.getTime()-days*86400000), to:null};
}
function dateFilterActive(){ const {from,to}=getDateRange(); return !!(from||to); }
// 현재 기간 필터를 세션 판별 함수로. 필터가 없으면 null(=전부 통과).
function makeDatePredicate(){
  const {from,to}=getDateRange();
  if(!from && !to) return null;
  return s=>{
    if(!s.lastTs) return false;
    const t=new Date(s.lastTs); if(isNaN(t)) return false;
    if(from && t<from) return false;
    if(to && t>to) return false;
    return true;
  };
}
function applyDateFilter(sessions){
  const pred=makeDatePredicate();
  return pred ? sessions.filter(pred) : sessions;
}
// 트리 노드(하위 포함)에서 기간 필터를 통과하는 세션 수
function nodeFilteredCount(node, pred){
  let c = pred ? node.sessions.filter(pred).length : node.sessions.length;
  for(const k in node.children) c += nodeFilteredCount(node.children[k], pred);
  return c;
}
function dateBtnLabel(){
  const m=dateFilter.mode;
  if(m==="today") return "기간: 오늘 ▾";
  if(m==="7")     return "기간: 7일 ▾";

  if(m==="custom" && dateFilterActive()) return `기간: ${dateFilter.from||"…"}~${dateFilter.to||"…"} ▾`;
  return "기간 ▾";
}

function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts); if(isNaN(d)) return "";
  return d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function fmtSize(n){ return n>1e6?(n/1e6).toFixed(1)+"M":Math.round(n/1e3)+"K"; }
function fmtNum(n){ n=n||0; if(n>=1e6) return (n/1e6).toFixed(1)+"M"; if(n>=1e3) return (n/1e3).toFixed(1)+"k"; return ""+n; }
function fmtDur(a,b){ if(!a||!b) return ""; const ms=new Date(b)-new Date(a); if(isNaN(ms)||ms<0) return "";
  const m=Math.round(ms/60000); if(m<60) return m+"분"; const h=Math.floor(m/60); return h+"시간 "+(m%60)+"분"; }
function shortModel(m){ if(!m) return ""; return m.replace("claude-","").replace(/-\d{8}$/,""); }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
let toastTimer=null;
function toast(msg, isErr){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.className = isErr?"show err":"show";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=""; }, 3200);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    // 클립보드 API 실패 시 textarea 폴백
    try{ const ta=document.createElement("textarea"); ta.value=text;
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }
    catch(_){ return false; }
  }
}
// resume: 'cd <cwd> && claude -r <id>' 를 클립보드에 복사. 원하는 터미널(cmux 등)에 붙여넣어 실행.
function shQuote(s){ return "'" + String(s==null?"":s).replace(/'/g, "'\\''") + "'"; }
async function resumeSession(cwd, sid){
  const cmd = (cwd ? `cd ${shQuote(cwd)} && ` : "") + `claude -r ${shQuote(sid)}`;
  if(await copyText(cmd)) toast("resume 명령을 복사했어요 — 터미널에 붙여넣으세요");

}

// ---------- 트리 ----------
function buildTree(sessions){
  const root = {name:"", path:"", children:{}, sessions:[], count:0};
  for(const s of sessions){
    const cwd = s.cwd;
    if(!cwd){ (root.children["(기타)"] ||= {name:"(기타)",path:"__other__",children:{},sessions:[],count:0});
              root.children["(기타)"].sessions.push(s); root.children["(기타)"].count++; continue; }
    const parts = cwd.replace(/\\/g,"/").split("/").filter(Boolean);  // Windows 역슬래시 경로도 분리
    let node = root, acc="";
    for(const p of parts){
      acc += "/"+p;
      node.children[p] ||= {name:p, path:acc, children:{}, sessions:[], count:0};
      node = node.children[p];
    }
    node.sessions.push(s);
  }
  // count = 자기 세션 + 자식 합계
  (function tally(n){ let c=n.sessions.length; for(const k in n.children) c+=tally(n.children[k]); n.count=c; return c; })(root);
  return root;
}
// 외동 자식 경로 압축 (a/b/c 가 하나뿐이면 한 줄로). pred: 기간 필터(없으면 null=전부)
// 표시 카운트는 필터 통과분으로, 0건 노드는 숨긴다. 클릭 시엔 필터 전 전체 세션을 넘겨
// showList 가 다시 필터링하므로 필터를 넓혀도 목록이 올바르게 복원된다.
// 들여쓰기는 .children 의 가이드 라인(CSS)이 담당하므로 depth 는 쓰지 않는다.
function renderNode(node, pred){
  // compress single-child chains that have no own sessions
  let label = node.name, cur = node;
  while(Object.keys(cur.children).length===1 && cur.sessions.length===0){
    const only = cur.children[Object.keys(cur.children)[0]];
    label += "/"+only.name; cur = only;
  }
  const count = nodeFilteredCount(cur, pred);
  if(count===0) return null;   // 기간 필터로 0건이면 노드 숨김
  const kids = Object.values(cur.children)
    .map(k=>[k, nodeFilteredCount(k, pred)]).filter(([,c])=>c>0)
    .sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  const el = document.createElement("div"); el.className="node";
  const row = document.createElement("div"); row.className="row";
  row.dataset.path = cur.path || "";
  row.title = label || "/";        // 압축 경로 전체는 툴팁으로
  const hasKids = kids.length>0;
  // 압축된 경로는 앞부분만 줄이고 마지막 세그먼트는 항상 보이게 나눠 렌더
  const cut = label.lastIndexOf("/");
  const pre = cut>=0 ? label.slice(0, cut+1) : "";
  const last = (cut>=0 ? label.slice(cut+1) : label) || "/";
  row.innerHTML = `<span class="tw${hasKids?" has":""}"></span><span class="ndot"></span>`+
    `<span class="nlabel">${pre?`<span class="npre">${esc(pre)}</span>`:""}`+
    `<span class="nlast">${esc(last)}</span></span>`+
    `<span class="ncount">${count}</span>`;
  el.appendChild(row);
  const childWrap = document.createElement("div"); childWrap.className="children";
  for(const k of kids){ const ch=renderNode(k, pred); if(ch) childWrap.appendChild(ch); }
  el.appendChild(childWrap);
  row.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll("#tree .row.sel").forEach(r=>r.classList.remove("sel"));
    row.classList.add("sel");
    if(hasKids) el.classList.toggle("open");   // 트위스티 회전은 CSS 가 처리
    // 이 노드(하위 포함)의 모든 세션(필터 전) — showList 가 현재 기간 필터를 적용
    const all=[]; (function collect(n){ all.push(...n.sessions); for(const k in n.children) collect(n.children[k]); })(cur);
    clearSearchMarks();   // 이전 검색의 hits/snippet 이 폴더 목록에 남지 않게
    showList(all, label);
  };
  return el;
}
// 트리 맨 위에 고정되는 가상 노드. 디렉토리가 아니라 별을 단 세션 묶음을 보여준다.

// 트리 전체를 (필터 반영해) 렌더. 펼침/선택 상태는 유지. autoOpenFirst 는 초기 로드용.
let TREE = null;
function renderTree(autoOpenFirst){
  const treeBox=$("#tree"); if(!treeBox || !TREE) return;
  // 스냅샷: 펼쳐진 노드 path 들 + 선택된 path
  const openPaths=new Set();
  treeBox.querySelectorAll(".node.open > .row").forEach(r=>{ if(r.dataset.path) openPaths.add(r.dataset.path); });
  const selEl=treeBox.querySelector(".row.sel"); const selPath=selEl?selEl.dataset.path:null;
  const pred=makeDatePredicate();
  treeBox.innerHTML="";
  // 기간 필터와 무관하게 항상 맨 위에
  treeBox.appendChild(favRow());
  treeBox.appendChild(trashRow());
  const kids=Object.values(TREE.children)
    .map(k=>[k, nodeFilteredCount(k, pred)]).filter(([,c])=>c>0)
    .sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  if(!kids.length){
    treeBox.insertAdjacentHTML("beforeend",
      '<div class="empty">'+(dateFilterActive()?"이 기간에 세션이 없습니다":"세션 없음")+'</div>');
  } else {
    for(const k of kids){ const el=renderNode(k, pred); if(el) treeBox.appendChild(el); }
  }
  // 복원: 펼침 + 선택
  let restoredSel=false;
  treeBox.querySelectorAll(".row").forEach(r=>{
    const p=r.dataset.path;
    if(p && openPaths.has(p)){ const nd=r.closest(".node"); if(nd) nd.classList.add("open"); }
    if(p && selPath && p===selPath){ r.classList.add("sel"); restoredSel=true; }
  });
  // 최초 로드에서 자동으로 펼칠 대상은 즐겨찾기가 아니라 첫 디렉토리다
  if(autoOpenFirst && !restoredSel){
    const firstRow=treeBox.querySelector(".row:not(.favrow)"); if(firstRow) firstRow.click(); }
}

    (s.hits?`<span class="hits">검색 ${s.hits}건</span>`:"")+
    `</div>`+
    `<div class="retention">`+ delBadge(s)+
      `<button class="extendbtn" title="삭제 시계를 지금 기준 ${cleanupDays}일로 리셋">⏱ 연장</button>`+
    `</div>`+ (s.snippet?`<div class="sub">${esc(s.snippet)}</div>`:"");
  d.onclick = ()=>openSession(s.file);
  const cb=d.querySelector(".selchk");
  if(cb) cb.onclick=(e)=>{ e.stopPropagation(); toggleSelect(s.file, cb.checked); };
  const ext=d.querySelector(".extendbtn");
  if(ext) ext.onclick=(e)=>{ e.stopPropagation(); extendSessions([s.file]); };
  const fb=d.querySelector(".favbtn");
  if(fb) fb.onclick=(e)=>{ e.stopPropagation(); toggleFav(s, fb); };
  const tb=d.querySelector(".trashbtn");
  if(tb) tb.onclick=(e)=>{ e.stopPropagation(); confirmDelete([s.file]); };
  return d;
}
// 분기(/branch) 위계를 부모 밑 들여쓰기로 렌더. byIdAll = 전체 세션 인덱스(부모가 다른 그룹/폴더여도 탐지)
function renderForest(container, list, byIdAll){
  const inGroup = new Set(list.map(s=>s.uuid));
  const childrenOf = new Map();        // parentId -> [child,...]
  const roots = [];
  for(const s of list){
    const p = s.parentSessionId;
    if(p && inGroup.has(p)) (childrenOf.get(p) || childrenOf.set(p,[]).get(p)).push(s);
    else roots.push(s);                // 부모가 이 그룹에 없으면 루트로 취급
  }
  const byTime = a => a.sort((x,y)=>(y.lastTs||"").localeCompare(x.lastTs||""));
  byTime(roots);
  function walk(s, depth){
    let mark = null;
    if(s.parentSessionId && !inGroup.has(s.parentSessionId)){
      const pm = byIdAll.get(s.parentSessionId);
      mark = "분기 원본: " + (pm ? (pm.aiTitle || pm.uuid.slice(0,8)) : s.parentSessionId.slice(0,8));
    } else if(depth>0){
      mark = "부모 세션에서 /branch 로 분기됨";
    }
    container.appendChild(sessEl(s, depth, mark));
    const kids = childrenOf.get(s.uuid);
    if(kids){ byTime(kids); for(const k of kids) walk(k, depth+1); }
  }
  for(const r of roots) walk(r, 0);
}
function showList(sessions, title, isFavView){
  curListRaw = sessions; curListTitle = title||"";
  curListIsFav = !!isFavView; curListIsTrash = false;
  curList = applyDateFilter(sessions).slice().sort((a,b)=>(b.lastTs||"").localeCompare(a.lastTs||""));
  const box = $("#list");
  box.innerHTML = "";
  if(!curList.length){
    box.innerHTML = dateFilterActive()
      ? '<div class="empty">이 기간에 세션이 없습니다</div>'
      : curListIsFav
        ? '<div class="empty">즐겨찾기한 세션이 없습니다<br><br>세션 카드의 ☆ 를 눌러 추가하세요</div>'
        : '<div class="empty">세션이 없습니다</div>';
    return;
  }
  box.insertAdjacentHTML("beforeend", listToolbar());
  const byIdAll = new Map(SESSIONS.map(s=>[s.uuid, s]));   // 분기 원본 탐지용 전역 인덱스
  // 브랜치별 그룹화 (브랜치명 그대로, 슬래시 위계 유지)
  const groups = new Map();           // branch -> sessions[]
  for(const s of curList){
    const br = s.gitBranch || "(브랜치 없음)";
    (groups.get(br) || groups.set(br, []).get(br)).push(s);
  }
  // 그룹 정렬: 그룹 내 최신 세션 시각 desc
  const ordered = [...groups.entries()].sort((a,b)=>
    (b[1][0].lastTs||"").localeCompare(a[1][0].lastTs||""));
  for(const [br, list] of ordered){
    const g=document.createElement("div"); g.className="bgroup open";
    const h=document.createElement("div"); h.className="bhead";
    h.innerHTML = `<span class="tw has"></span><span class="bname">🔀 ${esc(br)}</span><span class="bcount">${list.length}</span>`;
    h.onclick = ()=>{ g.classList.toggle("open"); };   // 트위스티 회전은 CSS 가 처리
    g.appendChild(h);
    const body=document.createElement("div"); body.className="bbody";
    renderForest(body, list, byIdAll);   // 그룹 안에서 /branch 분기 위계 들여쓰기
    g.appendChild(body);
    box.appendChild(g);
  }
  wireToolbar();
}

function wireToolbar(){

async function extendSessions(files){
  files=(files||[]).filter(Boolean);
  if(!files.length) return;
  let r; try{ r=await (await fetch("/api/touch",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({files})})).json(); }
  catch(e){ toast("연장 실패", true); return; }
  const okMap=new Map((r.results||[]).filter(x=>x.ok).map(x=>[x.file,x.mtime]));
  for(const s of SESSIONS){ if(okMap.has(s.file)) s.mtime=okMap.get(s.file); }   // 로컬 mtime 갱신
  for(const s of curListRaw){ if(okMap.has(s.file)) s.mtime=okMap.get(s.file); } // 목록이 SESSIONS 밖 객체(검색 결과 등)여도 갱신

// 확인 모달 공통 틀. okLabel 을 누르면 run() 을 실행한다.
function confirmModal({title, note, rows, okLabel, danger}){
  const html=`<div class="dm-box">`+
    `<div class="dm-h${danger?"":" mild"}">${title}</div>`+
    `<div class="dm-note">${note}</div>`+
    (rows?`<div class="dm-list"><table>${rows}</table></div>`:"")+
    `<div class="dm-btns"><button id="dmCancel" class="minibtn">취소</button>`+
    `<button id="dmOk" class="minibtn ${danger?"danger":"primary"}">${esc(okLabel)}</button></div></div>`;
  const ov=document.createElement("div"); ov.className="dm-ov"; ov.innerHTML=html;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  ov.querySelector("#dmCancel").onclick=close;
  return new Promise(resolve=>{
    ov.querySelector("#dmOk").onclick=async ()=>{
      ov.querySelector("#dmOk").disabled=true;
      ov.querySelector("#dmCancel").disabled=true;
      await resolve(true);
      close();
    };
  });
}
function confirmDelete(files){
  files=(files||[]).filter(Boolean);
  if(!files.length) return;
  const items=files.map(f=>SESSIONS.find(s=>s.file===f)).filter(Boolean);
  const rows=items.map(s=>{
    const n=daysLeft(s);
    const ttl=s.aiTitle||s.lastPrompt||s.uuid;
    return `<tr><td class="dm-t" title="${esc(ttl)}">${esc(ttl)}</td>`+
      `<td class="dm-d">${fmtTime(s.lastTs)}</td>`+
      `<td class="dm-x">${n===null?"":(n<=0?"삭제 임박":"D-"+n)}</td></tr>`;
  }).join("");

    title:`세션 ${items.length}개를 휴지통으로 보낼까요?`,
    note:"파일은 지워지지 않고 <b>휴지통으로 이동</b>합니다. 언제든 복원할 수 있습니다.<br>"+
         "다만 휴지통에 있는 동안에는 Claude Code 에서 이 세션들을 열 수 없습니다.",
    rows, okLabel:"🗑 휴지통으로",

}
async function doTrash(files){
  let r; try{ r=await (await fetch("/api/trash",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({files})})).json(); }
  catch(e){ toast("휴지통으로 옮기지 못했습니다", true); return; }
  const okFiles=new Set((r.results||[]).filter(x=>x.ok).map(x=>x.file));
  const okN=okFiles.size, failN=(r.results||[]).length-okN;
  // 즐겨찾기는 지우지 않는다 — 복원하면 별이 그대로 살아 있어야 한다.
  SESSIONS=SESSIONS.filter(s=>!okFiles.has(s.file));
  curListRaw=curListRaw.filter(s=>!okFiles.has(s.file));
  okFiles.forEach(f=>selected.delete(f));
  if(curFile && okFiles.has(curFile)){
    curFile=null; $("#detail").innerHTML='<div class="empty">세션을 선택하세요</div>';
  }
  await loadTrash();
  TREE=buildTree(SESSIONS);   // 트리 노드 카운트 갱신
  renderTree(false);
  rerenderList();
  toast(okN?`휴지통으로 이동: ${okN}개${failN?` · 실패 ${failN}`:""}`
           :`이동 실패${failN?`: ${failN}개`:""}`, failN>0);
}

async function doPurge(ids, isAll){

// ---------- 상세 ----------
function renderText(t){
  // 코드펜스 ``` 분리 (user 본문용 — 마크다운 변환 없이 원문 그대로 보여준다)
  const parts = t.split(/```/g); let html="";
  parts.forEach((seg,i)=>{
    if(i%2===1){ const nl=seg.indexOf("\n"); const body=nl>=0?seg.slice(nl+1):seg;
      html += `<pre><code>${esc(body)}</code></pre>`; }
    else { html += `<span>${esc(seg).replace(/`([^`]+)`/g,'<code class="inline">$1</code>')}</span>`; }
  });
  return html;
}

// ---------- 마크다운 렌더 (assistant 본문 전용) ----------
// 외부 라이브러리 없이 Claude 가 실제로 쓰는 문법만 처리한다. 순서가 중요하다:
//   ① 펜스 코드를 자리표시자로 빼두고  ② 전체를 이스케이프한 뒤
//   ③ 블록 → 인라인 순으로 변환하고   ④ 마지막에 코드를 되돌린다.
// 이 순서라야 코드 안의 마크다운 기호가 변환되지 않고, 원문 HTML 도 무력화된다.
const MD_URL_OK = /^(https?:\/\/|mailto:)/i;
const MD_LIST = /^( *)([-*+]|\d+[.)])\s+(.*)$/;
const MD_PH = /^\uE000C(\d+)\uE000$/;

// 이미 이스케이프된 문자열을 속성에 넣을 때 (esc 는 따옴표를 건드리지 않는다)
function escQ(s){ return s.replace(/"/g, "&quot;"); }

function mdInline(s){
  return s
    .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+?)\*/g, "$1<em>$2</em>")
    .replace(/~~([^\n]+?)~~/g, "<del>$1</del>")
    // 링크는 스킴을 검사해 javascript: 같은 건 원문 그대로 둔다
    .replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, (m, txt, url) =>
      MD_URL_OK.test(url)
        ? `<a href="${escQ(url)}" target="_blank" rel="noopener noreferrer">${txt}</a>` : m);
}

// 주의: 블록 판정은 '이스케이프된' 줄에 대해 돈다. 인용부호 > 는 이미 &gt; 가 돼 있다.
const MD_QUOTE = /^ {0,3}&gt;/;
function mdIsBlock(ln){
  const t = ln.trim();
  return MD_PH.test(t) || /^ {0,3}#{1,6}\s/.test(ln) || MD_QUOTE.test(ln)
      || /^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(ln) || MD_LIST.test(ln);
}

function mdCells(ln){
  return ln.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
}
function mdTable(lines, start){
  const head = mdCells(lines[start]);
  const al = mdCells(lines[start+1]).map(c =>
    /^:-+:$/.test(c) ? "center" : /-+:$/.test(c) ? "right" : "");
  let i = start+2; const rows=[];
  while(i<lines.length && lines[i].trim() && lines[i].includes("|")){ rows.push(mdCells(lines[i])); i++; }
  const sty = n => al[n] ? ` style="text-align:${al[n]}"` : "";
  const th = head.map((c,n)=>`<th${sty(n)}>${mdInline(c)}</th>`).join("");
  const tb = rows.map(r=>`<tr>${head.map((_,n)=>`<td${sty(n)}>${mdInline(r[n]||"")}</td>`).join("")}</tr>`).join("");
  return [`<div class="mdtable"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`, i];
}

// 같은 들여쓰기의 항목을 모으고, 더 깊은 줄은 그 항목 본문으로 재귀 처리
function mdList(lines, start){
  const first = lines[start].match(MD_LIST);
  const indent = first[1].length;
  const ordered = /\d/.test(first[2]);
  const items = []; let i = start;
  while(i < lines.length){
    const m = lines[i].match(MD_LIST);
    if(m && m[1].length === indent){ items.push([m[3]]); i++; }
    else if(items.length && lines[i].trim() &&
            (!MD_LIST.test(lines[i]) || lines[i].match(MD_LIST)[1].length > indent)){
      items[items.length-1].push(lines[i].replace(new RegExp("^ {0,"+(indent+2)+"}"), "")); i++;
    }
    else break;
  }
  const lis = items.map(it=>{
    let head = it[0], prefix = "", cls = "";
    const cb = head.match(/^\[([ xX])\]\s+([\s\S]*)$/);
    if(cb){
      cls = ' class="task"';
      prefix = `<input type="checkbox" disabled${/[xX]/.test(cb[1]) ? " checked" : ""}> `;
      head = cb[2];
    }
    const rest = it.slice(1);
    return `<li${cls}>${prefix}${mdInline(head)}${rest.length ? mdBlocks(rest) : ""}</li>`;
  }).join("");
  return [ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`, i];
}

function mdBlocks(lines){
  const out = []; let i = 0;
  while(i < lines.length){
    const ln = lines[i], t = ln.trim();
    if(!t){ i++; continue; }
    if(MD_PH.test(t)){ out.push(t); i++; continue; }                       // 코드펜스 자리표시자
    if(/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }
    const h = ln.match(/^ {0,3}(#{1,6})\s+(.*)$/);
    if(h){ const lv = h[1].length; out.push(`<h${lv}>${mdInline(h[2].trim())}</h${lv}>`); i++; continue; }
    if(MD_QUOTE.test(ln)){
      const buf = [];
      while(i<lines.length && MD_QUOTE.test(lines[i])){ buf.push(lines[i].replace(/^ {0,3}&gt; ?/,"")); i++; }
      out.push(`<blockquote>${mdBlocks(buf)}</blockquote>`); continue;
    }
    // 표: 헤더 다음 줄이 구분선(|---|)이어야 한다
    if(ln.includes("|") && i+1 < lines.length && lines[i+1].includes("|")
       && /^[\s:|-]*-[\s:|-]*$/.test(lines[i+1])){
      const [html, ni] = mdTable(lines, i); out.push(html); i = ni; continue;
    }
    if(MD_LIST.test(ln)){ const [html, ni] = mdList(lines, i); out.push(html); i = ni; continue; }
    // 문단 — 문단 안의 줄바꿈은 <br> 로 살린다
    const buf = [];
    while(i<lines.length && lines[i].trim() && !mdIsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ i++; continue; }                                      // 전진 보장
    out.push(`<p>${mdInline(buf.join("\n")).replace(/\n/g,"<br>")}</p>`);
  }
  return out.join("");
}

function renderMarkdown(text){
  const codes = [];
  const src = String(text).replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, body)=>{
    const l = lang.trim();
    codes.push(`<pre${l ? ` data-lang="${escQ(esc(l))}"` : ""}>`+
               `<code>${esc(body.replace(/\n+$/,""))}</code></pre>`);
    return `\uE000C${codes.length-1}\uE000`;
  });
  return mdBlocks(esc(src).split("\n"))
    .replace(/\uE000C(\d+)\uE000/g, (m,n)=>codes[+n] || "");
}

function blockHTML(b, md){
  if(b.kind==="text") return md
    ? `<div class="blk text md">${renderMarkdown(b.text)}</div>`
    : `<div class="blk text">${renderText(b.text)}</div>`;
  if(b.kind==="thinking") return `<details class="think blk"><summary>💭 thinking</summary><div class="blk text">${esc(b.text)}</div></details>`;
  if(b.kind==="tool_use"){ let inp=""; try{inp=JSON.stringify(b.input,null,2);}catch{inp=String(b.input);}
    return `<div class="tool blk"><span class="tname">⚙ ${esc(b.name)}</span><pre><code>${esc(inp)}</code></pre></div>`; }
  if(b.kind==="tool_result"){ const long=b.text.length>800;
    return `<div class="toolres blk ${b.is_error?'err':''} ${long?'clamped':''}"><pre><code>${esc(b.text)}</code></pre>`+
      (long?`<span class="more">… 더 보기 (${b.text.length}자)</span>`:"")+`</div>`; }
  if(b.kind==="image") return `<div class="blk"><em style="color:var(--muted)">[이미지]</em></div>`;
  return "";
}
const SYS_RE = /^<(ide_opened_file|system-reminder|command-name|command-message|command-args|local-command)/;
// 주입 메시지 종류별 표시 이름. 슬래시 명령과 작업 알림은 알맹이를 뽑아 제목에 쓴다.
function injectLabel(kind, text){
  const pick = re => { const m=String(text).match(re); return m ? m[1].trim() : ""; };
  switch(kind){
    case "task-notification": {
      const s = pick(/<summary>([\s\S]*?)<\/summary>/);
      return {icon:"🔔", label: s ? "작업 알림 · "+s.slice(0,60) : "백그라운드 작업 알림"};
    }
    case "command-name": {
      const c = pick(/<command-name>([\s\S]*?)<\/command-name>/);
      return {icon:"⌘", label: c || "슬래시 명령"};
    }
    case "compact":              return {icon:"🗜", label:"컨텍스트 압축 요약"};
    case "local-command-stdout": return {icon:"⌘", label:"명령 출력"};
    case "local-command-caveat": return {icon:"⚠", label:"명령 주의 안내"};
    case "system-reminder":      return {icon:"📎", label:"시스템 리마인더"};
    case "ide_opened_file":      return {icon:"📄", label:"IDE 열린 파일"};
    default:                     return {icon:"📎", label:"주입 컨텍스트"};
  }
}
function msgHTML(ev){
  // Claude Code 의 user role 에는 3종류가 섞여 있다:
  //  ① 실제 사용자 입력  ② 도구 결과(tool_result)  ③ 하니스 주입(isMeta: 스킬 본문/시스템 컨텍스트)
  const isToolResult = ev.role==="user" && ev.blocks.length>0
                       && ev.blocks.every(b=>b.kind==="tool_result");
  // ev.inject: 서버가 판정한 '사용자 입력이 아님'의 종류 (task-notification, 슬래시 명령 등)
  const isMeta = ev.role==="user" && !isToolResult && (ev.isMeta || !!ev.inject);
  const role = ev.role==="assistant" ? "asst"
             : isToolResult ? "tool"
             : isMeta ? "meta" : "user";
  const blocks = ev.blocks.map(b=>{
    // 사용자 시스템 주입 텍스트는 접기
    if(role==="user" && b.kind==="text" && SYS_RE.test(b.text.trim()))
      return `<details class="sys blk"><summary>시스템 주입 블록</summary><div class="blk text">${esc(b.text)}</div></details>`;
    return blockHTML(b, role==="asst");   // assistant 본문만 마크다운으로 렌더
  }).join("");
  // 메타(주입) 메시지: 길고 사용자와 무관하므로 기본 접힘
  if(role==="meta"){
    const firstTxt = (ev.blocks.find(b=>b.kind==="text")||{}).text || "";
    const info = injectLabel(ev.inject, firstTxt);
    // 봉투 태그를 걷어낸 본문 미리보기
    const peek = esc(firstTxt.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,70));
    return `<div class="msg role-meta"><div class="head"><b>${info.icon} ${esc(info.label)}</b>`+
      `<span>${fmtTime(ev.ts)}</span></div>`+
      `<details class="sys"><summary>${peek||"주입된 내용"} … (펼치기)</summary>`+
      `<div class="bubble">${blocks}</div></details></div>`;
  }
  // 표시 필터로 안이 전부 비는 메시지는 말풍선과 머리글까지 통째로 감춘다.
  // (예: thinking + 도구 호출만 있는 assistant 메시지에서 둘 다 끈 경우)
  // 어떤 유형이 들어 있는지 렌더 시점에 클래스로 남겨두면, 토글할 때 CSS 선택자만으로
  // 판정된다 — 6만 노드를 순회하는 비용이 들지 않는다.
  const kinds = new Set(ev.blocks.map(b=>b.kind));
  const allHideable = kinds.size>0 && [...kinds].every(k=>k==="thinking"||k==="tool_use");
  const hb = allHideable
    ? " hb-all"+(kinds.has("thinking")?" hb-think":"")+(kinds.has("tool_use")?" hb-tool":"")
    : "";
  const who = role==="asst" ? "🤖 Assistant" : role==="tool" ? "🔧 도구 결과" : "🧑 User";
  return `<div class="msg role-${role}${hb}">`+
    `<div class="head"><b>${who}</b><span>${fmtTime(ev.ts)}</span>`+
    (ev.model?`<span>${esc(shortModel(ev.model))}</span>`:"")+
    (ev.isSidechain?`<span>↳ sidechain</span>`:"")+`</div>`+
    `<div class="bubble">${blocks}</div></div>`;
}
// 세션을 열면 맨 아래(= 최신 메시지)로 내린다.
// content-visibility 때문에 처음 scrollHeight 는 추정값이고, 화면에 들어온 메시지가
// 실제로 레이아웃되면서 높이가 계속 바뀐다. 한 번만 내리면 바닥에 닿지 못하므로
// 몇 프레임에 걸쳐 다시 내리되, 사용자가 스크롤을 잡으면 즉시 멈춘다.
function scrollToBottom(el){
  const ac = new AbortController();
  const stop = ()=>ac.abort();
  el.addEventListener("wheel", stop, {passive:true, signal:ac.signal});
  el.addEventListener("touchstart", stop, {passive:true, signal:ac.signal});
  let frames = 12;
  (function step(){
    if(ac.signal.aborted) return;
    el.scrollTop = el.scrollHeight;
    if(--frames > 0) requestAnimationFrame(step);
    else ac.abort();            // 리스너 정리
  })();
}

  scrollToBottom(D);   // 시간순이라 최신 메시지는 맨 아래에 있다

  clearTimeout(inSearchTimer); searchMarks=[]; searchIdx=-1; lastSearched="";
  // 긴 세션에서는 검색 한 번에 수만 개 텍스트 노드를 훑는다. 타이핑이 멎은 뒤에만 돌린다.
  $("#inSearch").oninput = e=>{

    inSearchTimer=setTimeout(()=>inSessionSearch(q), 150);
  };
  $("#inSearch").addEventListener("keydown", e=>{

    if(e.target.value !== lastSearched){

  $("#inPrev").onclick=()=>gotoMatch(-1);
  $("#inNext").onclick=()=>gotoMatch(1);

  const resumeBtn=$("#resumeBtn");

  if(favBtn) favBtn.onclick=()=>{ toggleFav(m); if(!curListIsFav) rerenderList(); };
  const pl=D.querySelector(".plink"); if(pl) pl.onclick=()=>openSession(pl.dataset.pf);
  // tool_result 더보기/접기 — 전체 텍스트는 이미 렌더돼 있고 CSS 로 높이만 제한
  D.querySelectorAll(".toolres .more").forEach(el=>{
    el.onclick=()=>{ const box=el.closest(".toolres");
      const expanded=box.classList.toggle("expanded");

}
let searchMarks=[], searchIdx=-1, inSearchTimer=null, lastSearched="";
function inSessionSearch(q){
  const body=$("#detailBody"); const cnt=$("#inCount");
  lastSearched=q;
  body.querySelectorAll("mark").forEach(mk=>{ mk.replaceWith(document.createTextNode(mk.textContent)); });
  body.normalize();
  searchMarks=[]; searchIdx=-1;
  if(!q || q.length<2){ cnt.textContent=""; return; }
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
  const targets=[]; let node;
  while(node=walker.nextNode()){ const pe=node.parentElement;
    // 접힌 요약(summary)과 메시지 헤더(역할·시각·모델)는 검색 대상에서 제외 —
    // 전체 검색 건수(서버)와 대상을 맞춰 건수 불일치를 막는다.
    if(pe.closest("summary")||pe.closest(".head")) continue;
    if(re.test(node.nodeValue)) targets.push(node); }
  for(const t of targets){
    const frag=document.createDocumentFragment(); let last=0; re.lastIndex=0; let mm;
    while(mm=re.exec(t.nodeValue)){ frag.appendChild(document.createTextNode(t.nodeValue.slice(last,mm.index)));
      const mk=document.createElement("mark"); mk.textContent=mm[0]; frag.appendChild(mk); last=mm.index+mm[0].length; }
    frag.appendChild(document.createTextNode(t.nodeValue.slice(last))); t.parentNode.replaceChild(frag,t);
  }
  searchMarks=[...body.querySelectorAll("mark")];
  if(searchMarks.length){ gotoMatch(1); }     // 첫 항목 포커스
  else { cnt.textContent="0"; }
}
function gotoMatch(delta){
  if(!searchMarks.length){ $("#inCount").textContent="0"; return; }
  if(searchIdx>=0 && searchMarks[searchIdx]) searchMarks[searchIdx].classList.remove("cur");
  searchIdx = (searchIdx + delta + searchMarks.length) % searchMarks.length;
  const mk=searchMarks[searchIdx];
  mk.classList.add("cur");
  mk.scrollIntoView({block:"center", behavior:"smooth"});
  $("#inCount").textContent = `${searchIdx+1} / ${searchMarks.length}`;
}

// ---------- 세션 내 표시 필터 (체크 = 표시, 기본 전체 표시, localStorage 저장) ----------
const MSG_TYPES=[
  {k:"user",     label:"🧑 User"},
  {k:"asst",     label:"🤖 Assistant"},
  {k:"tool",     label:"🔧 도구 결과"},
  {k:"meta",     label:"📎 주입 컨텍스트"},
  {k:"thinking", label:"💭 thinking"},
  {k:"tooluse",  label:"⚙ 도구 호출"},
];
const ALL_TYPE_KEYS = MSG_TYPES.map(t=>t.k);
// 표시할 유형 집합. 저장값 없으면 전부 표시(기본). 체크 = 표시.
function getVisible(){
  const raw=localStorage.getItem("ccsv-show");
  if(raw===null) return new Set(ALL_TYPE_KEYS);
  try{ return new Set(JSON.parse(raw)); }catch{ return new Set(ALL_TYPE_KEYS); }
}
function setVisible(s){ localStorage.setItem("ccsv-show", JSON.stringify([...s])); }
function filterControlHTML(){
  const vis=getVisible();
  let h='<span class="filterwrap"><button id="filterBtn" title="표시할 메시지 유형">표시 ▾</button>';
  h+='<div id="filterPop"><div class="fp-h">표시할 유형 (체크 = 표시)</div>';
  for(const t of MSG_TYPES)
    h+=`<label class="fchk"><input type="checkbox" data-k="${t.k}" ${vis.has(t.k)?"checked":""}>`+
       `<span>${esc(t.label)}</span></label>`;
  return h+'</div></span>';
}
function applyMsgFilter(){
  const body=$("#detailBody"); if(!body) return;
  const vis=getVisible();
  for(const t of MSG_TYPES) body.classList.toggle("hide-"+t.k, !vis.has(t.k));
}
function setupFilterPopover(){
  const btn=$("#filterBtn"), pop=$("#filterPop");
  if(!btn||!pop) return;
  btn.onclick=e=>{ e.stopPropagation(); pop.classList.toggle("open"); };
  pop.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.onchange=()=>{ const vis=getVisible();
      cb.checked ? vis.add(cb.dataset.k) : vis.delete(cb.dataset.k);
      setVisible(vis); applyMsgFilter(); };
  });
  document.addEventListener("click", e=>{
    if(pop.classList.contains("open") && !pop.contains(e.target) && e.target!==btn) pop.classList.remove("open");
  });
}

async function loadSettings(){
  const body=$("#settingsBody"); body.innerHTML='<div class="spin">불러오는 중…</div>';
  let d; try{ d=await (await fetch("/api/settings")).json(); }
  catch(e){ body.innerHTML='<div class="empty">불러오기 실패</div>'; return; }
  $("#settingsPath").textContent=d.path||"";
  if(d.error){ body.innerHTML=`<div class="empty">${esc(d.error)}</div>`; return; }
  // cc-explorer 가 쓰는 설정은 파일/키가 없어도 기본값으로 노출된다(서버가 채워줌).
  const bools=(d.items||[]).filter(it=>it.type==="bool" && it.path.length===1);
  const numbers=(d.items||[]).filter(it=>it.type==="number" && it.path.length===1);
  const effort=(d.items||[]).find(it=>it.label==="effortLevel");
  let html='<div class="snote">'+(d.exists?"":"settings.json 이 아직 없습니다 — 값을 바꾸면 새로 만듭니다. ")+
    '변경은 다음 세션부터 반영될 수 있습니다. <span class="sabsent">기본값</span> = 파일에 없어 기본값 표시 중.</div>';
  for(const it of numbers){
    const unit = it.label==="cleanupPeriodDays" ? "일" : "";
    const v = esc(String(it.value));
    html+=`<div class="snum" data-path='${esc(JSON.stringify(it.path))}'>`+
      `<label>${esc(it.label)}</label>`+
      `<span class="snum-view"><b class="snum-val">${v}</b>${unit?` <span class="unit">${unit}</span>`:""}</span>`+
      `<input type="number" class="snum-input" min="1" step="1" value="${v}">`+
      (unit?`<span class="unit snum-eunit">${unit}</span>`:"")+
      `<button class="minibtn snum-edit">수정하기</button>`+
      `<button class="minibtn snum-save">저장</button>`+
      `<button class="minibtn snum-cancel">취소</button>`+
      `</div>`;
  }
  html+='<div class="sgrp"><div class="sgrp-h">일반 (체크 = 활성)</div>';
  for(const it of bools){
    const id="set_"+it.label.replace(/[^a-zA-Z0-9]/g,"_");
    html+=`<label class="schk" for="${id}"><input type="checkbox" id="${id}" `+
      `${it.value?"checked":""} data-path='${esc(JSON.stringify(it.path))}'>`+
      `<span class="sname">${esc(it.label)}</span>`+
      (it.absent?`<span class="sabsent">기본값</span>`:"")+`</label>`;
  }
  html+='</div>';
  if(effort){
    const opts=["low","medium","high","xhigh","max"];
    html+='<div class="sgrp"><div class="sgrp-h">effortLevel</div><div class="seffort">'+
      `<select id="effortSel">`+
      opts.map(o=>`<option value="${o}" ${o===effort.value?"selected":""}>${o}</option>`).join("")+
      `</select></div></div>`;
  }
  html+='<div class="sstatus" id="sStatus"></div>';
  body.innerHTML=html;
  body.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener("change", ()=>toggleSetting(cb));
  });
  body.querySelectorAll('.snum').forEach(row=>{
    const inp=row.querySelector(".snum-input");
    const val=row.querySelector(".snum-val");
    const path=JSON.parse(row.dataset.path);
    row.querySelector(".snum-edit").onclick=()=>{ row.classList.add("editing"); inp.value=val.textContent; inp.focus(); inp.select(); };
    row.querySelector(".snum-cancel").onclick=()=>{ row.classList.remove("editing"); };
    row.querySelector(".snum-save").onclick=()=>saveNumberSetting(path, inp, row, val);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") saveNumberSetting(path, inp, row, val);
                                         else if(e.key==="Escape") row.classList.remove("editing"); });
  });
  const sel=document.getElementById("effortSel");
  if(sel) sel.addEventListener("change", ()=>setStringSetting(["effortLevel"], sel.value, sel));
}
async function saveNumberSetting(path, inp, row, valEl){
  const value=parseInt(inp.value,10);
  const st=$("#sStatus");
  if(isNaN(value)){ st.textContent="숫자를 입력하세요"; st.className="sstatus err"; return; }
  inp.disabled=true;
  let r; try{ r=await (await fetch("/api/settings/set",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({path,value})})).json(); }
  catch(e){ r={ok:false,error:"요청 실패"}; }
  inp.disabled=false;
  if(r.ok){
    valEl.textContent=r.value;
    row.classList.remove("editing");
    st.textContent="저장됨 ✓ "+path.join(".")+" = "+r.value; st.className="sstatus ok";
    if(path.length===1 && path[0]==="cleanupPeriodDays"){ cleanupDays=r.value; rerenderList(); }
  } else {
    st.textContent="실패: "+(r.error||""); st.className="sstatus err";
  }
  setTimeout(()=>{ if(st) st.textContent=""; }, 2500);
}
async function toggleSetting(cb){
  const path=JSON.parse(cb.dataset.path);
  const value=cb.checked;
  cb.disabled=true;
  let r; try{ r=await (await fetch("/api/settings/set",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path,value})})).json(); }
  catch(e){ r={ok:false,error:"요청 실패"}; }
  cb.disabled=false;
  const st=$("#sStatus");
  if(r.ok){ cb.checked=value; st.textContent="저장됨 ✓ "+path.join("."); st.className="sstatus ok"; }
  else { cb.checked=!value; st.textContent="실패: "+(r.error||""); st.className="sstatus err"; }
  setTimeout(()=>{ if(st) st.textContent=""; }, 2500);
}
async function setStringSetting(path, value, el){
  el.disabled=true;
  let r; try{ r=await (await fetch("/api/settings/set",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path,value})})).json(); }
  catch(e){ r={ok:false,error:"요청 실패"}; }
  el.disabled=false;
  const st=$("#sStatus");
  if(r.ok){ st.textContent="저장됨 ✓ "+path.join(".")+" = "+value; st.className="sstatus ok"; }
  else { st.textContent="실패: "+(r.error||""); st.className="sstatus err"; }
  setTimeout(()=>{ if(st) st.textContent=""; }, 2500);
}

// ---------- 패널 너비 조정 (splitter 드래그 + localStorage 기억) ----------
function setupSplitters(){
  for(const sp of document.querySelectorAll(".splitter")){
    const id = sp.dataset.target;               // "tree" | "list"
    const pane = document.getElementById(id);
    const saved = parseInt(localStorage.getItem("ccsv-w-"+id)||"",10);
    if(saved>=160) pane.style.flexBasis = saved+"px";
    sp.addEventListener("mousedown", e=>{
      e.preventDefault();
      const startX=e.clientX, startW=pane.getBoundingClientRect().width;
      sp.classList.add("drag"); document.body.classList.add("resizing");
      const move = ev=>{ pane.style.flexBasis = Math.max(160, Math.min(900, startW+(ev.clientX-startX)))+"px"; };
      const up = ()=>{
        sp.classList.remove("drag"); document.body.classList.remove("resizing");
        localStorage.setItem("ccsv-w-"+id, String(Math.round(pane.getBoundingClientRect().width)));
        window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up);
      };
      window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    });
    sp.addEventListener("dblclick", ()=>{ pane.style.flexBasis=""; localStorage.removeItem("ccsv-w-"+id); });
  }
}
// ---------- 테마 (라이트 / 다크) ----------
// 저장된 선택이 있으면 그것을, 없으면 OS 설정을 따른다. <head> 의 인라인 스크립트가
// 첫 페인트 전에 이미 적용해 두므로 여기서는 버튼 상태만 맞추고 토글을 연결한다.
function storedTheme(){
  try{ const t=localStorage.getItem("ccsv-theme"); return (t==="light"||t==="dark")?t:null; }
  catch(e){ return null; }
}
function osTheme(){ return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b=$("#themeBtn"); if(!b) return;
  b.textContent = t==="light" ? "☾" : "☀";               // 클릭하면 바뀔 쪽을 보여준다
  b.title = t==="light" ? "다크로 전환" : "라이트로 전환";
}
function setupTheme(){
  applyTheme(storedTheme() || osTheme());
  $("#themeBtn").onclick = ()=>{
    const next = document.documentElement.dataset.theme==="light" ? "dark" : "light";
    try{ localStorage.setItem("ccsv-theme", next); }catch(e){}
    applyTheme(next);
  };
  // 직접 고른 적이 없으면 OS 설정 변화를 그대로 따라간다
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", ()=>{
    if(!storedTheme()) applyTheme(osTheme());
  });
}

setupTheme();
setupSplitters();
setupDatePopover();
init();
